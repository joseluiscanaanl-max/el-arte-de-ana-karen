name: Publicar El Arte de Ana Karen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: el-arte-de-ana-karen-publicacion
  cancel-in-progress: true

jobs:
  validar:
    name: Validar antes de publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Validar sintaxis de todo JavaScript
        run: npm run check

      - name: Validar integridad de release
        run: npm run test:release

      - name: Probar pricing
        run: node tests/pricing.test.js

      - name: Probar dominio de pagos
        run: node tests/payments.test.js

      - name: Probar persistencia de pagos
        run: node tests/payments-storage.test.js

      - name: Ejecutar Playwright completo
        run: npm run test:e2e

      - name: Guardar reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-produccion-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publicar sitio
    needs: validar
    runs-on: ubuntu-slim
    environment:
      name: el-arte-de-ana-karen-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

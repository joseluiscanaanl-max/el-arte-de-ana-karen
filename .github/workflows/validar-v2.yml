name: Validar V2

on:
  push:
    branches:
      - v2-desarrollo
      - 'v2-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas V2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium y WebKit para Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Validar sintaxis de todo JavaScript
        run: npm run check

      - name: Validar integridad de release
        run: npm run test:release

      - name: Probar pricing
        run: node tests/pricing.test.js

      - name: Probar dominio de pagos
        run: node tests/payments.test.js

      - name: Probar persistencia de pagos
        run: node tests/payments-storage.test.js

      - name: Ejecutar Playwright completo
        run: npm run test:e2e

      - name: Guardar reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
